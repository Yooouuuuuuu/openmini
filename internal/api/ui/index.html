<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openmini</title>
<style>
  :root { color-scheme: dark;
    --bg:#0e1116; --card:#141922; --card2:#131a28; --fg:#e7eaee; --muted:#8a93a0; --dim:#5f6873; --line:#222a35; --hair:#1f242c;
    --track:#232b37; --ok:#34c46a; --bad:#ff6b60; --badfg:#ff8a80; --warn:#d99a2b; --warnfg:#e3b04b; --accent:#5b8def; --accentfg:#8ab4ff;
    --btn:#171c24; --btnline:#2c3441; --stopbg:#2a1717; --stopline:#5a2a2a; --runline:#2a4a8a; --pill:#1c2536; --halo:#1c2f52; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light;
    --bg:#f3f4f6; --card:#ffffff; --card2:#f4f7fd; --fg:#1c2128; --muted:#6b7480; --dim:#9aa3ad; --line:#e3e6ea; --hair:#eef0f3;
    --track:#e9ecf0; --ok:#1f9d55; --bad:#c62d1f; --badfg:#b42318; --warn:#d99a2b; --warnfg:#a56f12; --accent:#2457c5; --accentfg:#2457c5;
    --btn:#ffffff; --btnline:#d5d9df; --stopbg:#fff3f2; --stopline:#f0c4c0; --runline:#9db6ea; --pill:#e8effc; --halo:#dbe6fb; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,"Noto Sans TC",system-ui,sans-serif; }
  .mono { font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums }
  .big { font-family:"Inter Tight","IBM Plex Sans",system-ui,sans-serif; letter-spacing:-.02em }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 12px 14px 24px; border-bottom:1px solid var(--hair) }
  header .l { display:flex; align-items:baseline; gap:14px; min-width:0 } header h1 { margin:0; font-size:18px; font-weight:600 }
  header .base { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  header .r { display:flex; align-items:center; gap:14px; margin-left:auto } header .hint { font-size:12px; color:var(--muted) }
  .live { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted) } .live .d { width:6px; height:6px; border-radius:50%; background:var(--ok) } .live.off .d { background:var(--warn) }
  button { cursor:pointer; white-space:nowrap; font:inherit; font-size:12px; height:30px; padding:0 12px; border:1px solid var(--btnline); background:var(--btn); color:var(--fg); border-radius:8px }
  button:hover:not([disabled]) { border-color:var(--accent) } button[disabled] { opacity:.5; cursor:default }
  button.stop { color:var(--badfg); background:var(--stopbg); border-color:var(--stopline); font-weight:500; height:26px; padding:0 10px }
  button.all { height:34px; padding:0 14px; font-size:13px; font-weight:500 }
  main { padding:18px 24px 28px; display:flex; flex-direction:column; gap:16px }
  .row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px } @media (max-width:860px){ .row { grid-template-columns:1fr } }
  .row.reqs { margin-top:10px }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:14px }
  .th { display:flex; align-items:center; justify-content:space-between; gap:8px } .th .n { display:flex; align-items:center; gap:10px; min-width:0 }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none } .dot.ok { background:var(--ok) } .dot.bad { background:var(--bad) }
  .name { font-size:16px; font-weight:600 } .sub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .body { display:flex; align-items:center; gap:18px } .ring { position:relative; width:84px; height:84px; border-radius:50%; flex:none }
  .ring i { position:absolute; inset:9px; border-radius:50%; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center }
  .ring b { font-size:20px; font-weight:600; line-height:1 } .ring small { font-size:10px; color:var(--muted); margin-top:3px }
  .facts { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0 } .facts .t { font-size:13px; font-weight:500 } .facts .m { font-size:12px; color:var(--muted) }
  .hr { height:1px; background:var(--line); margin:6px 0 } .kv { display:flex; justify-content:space-between; gap:8px; font-size:12px; margin-top:4px } .kv .k { color:var(--muted) }
  .bar { height:5px; border-radius:3px; background:var(--track); overflow:hidden } .bar i { display:block; height:100%; background:var(--accent) }
  .bar.warn i { background:var(--warn) } .bar.bad i { background:var(--bad) } .warnfg { color:var(--warnfg) } .badfg { color:var(--badfg) }
  .foot { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); border-top:1px solid var(--hair); padding-top:10px; flex-wrap:wrap; margin-top:auto }
  .msg { color:var(--muted) } .msg.bad { color:var(--badfg) }
  .rings { display:flex; justify-content:space-around; gap:12px; padding:4px 0 } .rc { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; min-width:0 }
  .rc .lbl { font-size:13px; font-weight:500; margin-top:6px } .rc .w { font-size:11px; color:var(--muted); white-space:nowrap }
  .badge { position:relative; width:96px; height:92px } .badge .mini { position:absolute; right:-4px; bottom:0; border:3px solid var(--card); border-radius:50% }
  .ring.sm { width:40px; height:40px } .ring.sm i { inset:5px } .ring.sm b { font-size:11px }
  /* requests */
  .rq { gap:0 } .rq .th { margin-bottom:6px }
  .run { border:1px solid var(--runline); background:var(--card2); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; margin:4px 0 8px }
  .run .top { display:flex; align-items:center; gap:10px } .run .top .timer { margin-left:auto; font-size:16px; font-weight:600 }
  .steps { display:flex; align-items:center; gap:4px; font-size:12px } .sd { width:8px; height:8px; border-radius:50%; background:var(--btnline); flex:none }
  .sd.done { background:var(--ok) } .sd.now { background:var(--accentfg); box-shadow:0 0 0 3px var(--halo) } .steps .sn { margin-left:6px; font-weight:500 }
  .rrow { display:flex; flex-direction:column; gap:1px; padding:7px 0; border-top:1px solid var(--hair) } .rrow:first-of-type { border-top:0 }
  .rrow .l1 { display:flex; align-items:center; gap:8px; font-size:13px; min-width:0 } .rrow .l1 .m { overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .rrow .l1 .t { margin-left:auto; color:var(--muted) }
  .res { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex:none } .l2 { font-size:12px; color:var(--muted); word-break:break-word }
  .more { font-size:12px; color:var(--dim) }
</style>
</head>
<body>
<header>
  <div class="l"><h1 class="big">openmini</h1><span class="base mono" id="base"></span></div>
  <div class="r"><span class="hint mono">cached · all usage checks are manual</span><button class="all" onclick="refreshAll()" id="all">Refresh all</button></div>
</header>
<main>
  <div class="row" id="tiles"></div>
  <div class="row reqs" id="req"></div>
</main>
<script>
const BACKENDS = ['web','agy','agyapi'];
const SUB = { web:'Gemini web/app', agy:'Antigravity CLI', agyapi:'Antigravity service, direct' };
const state = { health:{}, live:false };

function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pct(s){ const m=/(\d{1,3})(?:\.\d+)?\s*%/.exec(String(s??'')); return m?parseInt(m[1],10):null; }
function clockOf(iso){ if(!iso) return 'never'; const d=new Date(iso); return isNaN(d)?esc(iso):d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function mmss(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function fmtN(n){ return (n||0).toLocaleString(); }
// Go duration "116h37m0s" -> "4d 20h" / "42m"
function dur(s){ s=String(s||''); const h=+(/(\d+)h/.exec(s)||[0,0])[1], m=+(/(\d+)m/.exec(s)||[0,0])[1]; if(!h&&!m) return s; if(h>=24) return Math.floor(h/24)+'d '+(h%24)+'h'; if(h) return h+'h '+m+'m'; return m+'m'; }
// Gemini app reset strings in zh-TW: "下午8:40", "上午12:40", "9月10日 下午12:40" -> "20:40", "00:40", "Sep 10 12:40"
function whenOf(s){
  s=String(s||''); if(!s) return '?';
  const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d=/(\d{1,2})月(\d{1,2})日/.exec(s); const t=/(上午|下午|AM|PM|am|pm)?\s*(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?/.exec(s);
  let out='';
  if(d) out+=mon[+d[1]-1]+' '+d[2]+' ';
  if(t){ let h=+t[2]; const ap=(t[1]||t[4]||'').toLowerCase(); const pm=ap==='下午'||ap==='pm'; const am=ap==='上午'||ap==='am'; if(pm&&h<12)h+=12; if(am&&h===12)h=0; out+=String(h).padStart(2,'0')+':'+t[3]; }
  return out.trim()||esc(s);
}
// the Gemini app gives reset times as clock text ("下午12:40", "9月10日 下午12:40"); turn them into time left
function dateOf(s){
  s=String(s||''); const d=/(\d{1,2})月(\d{1,2})日/.exec(s); const t=/(上午|下午|AM|PM|am|pm)?\s*(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?/.exec(s);
  if(!t) return null;
  let h=+t[2]; const ap=(t[1]||t[4]||'').toLowerCase(); if((ap==='下午'||ap==='pm')&&h<12)h+=12; if((ap==='上午'||ap==='am')&&h===12)h=0;
  const now=new Date(); const r=new Date(now.getFullYear(), d?+d[1]-1:now.getMonth(), d?+d[2]:now.getDate(), h, +t[3], 0, 0);
  if(r<now){ if(!d) r.setDate(r.getDate()+1); else if(now-r>7*864e5) r.setFullYear(r.getFullYear()+1); }
  return r;
}
function leftUntil(s){ const r=dateOf(s); if(!r) return whenOf(s); const m=Math.max(0,Math.round((r-Date.now())/6e4)); const h=Math.floor(m/60);
  if(h>=24) return Math.floor(h/24)+'d '+(h%24)+'h'; if(h) return h+'h '+(m%60)+'m'; return m+'m'; }
function cls(left){ return left==null?'':left<=10?'bad':left<=30?'warn':''; }
// colour slides from green (100% left) through yellow to red (0%)
function colorOf(left){ if(left==null) return 'var(--track)'; const l=Math.max(0,Math.min(100,left)); return `hsl(${Math.round(120*l/100)}, 62%, 46%)`; }
function ring(left,label,small){ const l=left==null?0:Math.max(0,Math.min(100,left)); const col=colorOf(left);
  return `<div class="ring ${small?'sm':''}" style="background:conic-gradient(${col} 0 ${l}%, var(--track) ${l}% 100%)"><i><b class="big mono">${left==null?'—':left+'%'}</b>${small?'':`<small>${esc(label||'left')}</small>`}</i></div>`; }
function bar(left){ const l=left==null?0:100-Math.max(0,Math.min(100,left)); return `<div class="bar ${cls(left)}"><i style="width:${l}%"></i></div>`; }
function kv(k,v,c){ return `<div class="kv"><span class="k">${esc(k)}</span><span class="mono ${c||''}">${v}</span></div>`; }

// agy / agyapi rows -> windows [{name, left, resets}], models[]
function windowsOf(name, rows){
  const wins=[]; const models=[]; let internal=0; const seen={};
  for(const r of rows){
    const pool=String(r.pool||''); const left=pct(r.remaining); const resets=r.resets_in?dur(r.resets_in):(r.resets_at?whenOf(r.resets_at):'');
    let win=String(r.window||'').replace(/limit remaining/i,'').replace(/^WTUS$/i,'5-hour').replace(/five hour/i,'5-hour').trim()||'5-hour';
    if(/^chat_|^tab_/.test(pool)){ internal++; continue; }
    const group=/claude|gpt/i.test(pool)?'Others':'Gemini'; if(name==='agyapi') models.push(pool);
    const key=group+'|'+win;
    if(!seen[key]){ seen[key]={group, win, name:group+' · '+win, left, resets, n:0, rank:group==='Gemini'?0:1}; wins.push(seen[key]); }
    seen[key].n++;
    if(left!=null && (seen[key].left==null || left<seen[key].left)) seen[key].left=left;
  }
  return {wins, models, internal};
}

function tile(name){
  const e=state[name]; const h=state.health[name]; const dot=h==='ok'?'ok':h?'bad':'';
  let body='', foot='';
  if(!e) body=`<div class="msg">Not loaded yet. Press Refresh.</div>`;
  else if(e.error) body=`<div class="msg bad">${esc(e.error)}</div>`;
  else if(name==='web'){
    const d=e.data||{}; const cu=pct(d.current_used), wu=pct(d.weekly_used);
    const wins=[]; if(wu!=null) wins.push({group:'Gemini', win:'Weekly', left:100-wu, resets:leftUntil(d.weekly_resets)}); if(cu!=null) wins.push({group:'Gemini', win:'5-hour', left:100-cu, resets:leftUntil(d.current_resets)});
    body=wins.length?rings(wins):`<div class="msg">no usage read</div>`;
    const notes=d.entry_notes; const noteTxt=!notes?'':Array.isArray(notes)?notes.join(' '):typeof notes==='object'?Object.values(notes).join(' '):String(notes);
    const until=/(\d{1,2}月\d{1,2}日)?\s*(上午|下午)?\s*\d{1,2}:\d{2}/.exec(noteTxt); // e.g. 用量額度將於 9月7日 上午1:40 重設
    const locked=(d.unavailable&&d.unavailable.length)?`<span class="badfg">locked: ${esc(d.unavailable.join(', '))}${until?` · until ${whenOf(until[0])}`:''}</span>`:'<span></span>';
    foot=`${locked}<span class="mono">updated ${clockOf(e.at)}</span>`;
    if(d.panel_error) body+=`<div class="msg bad">${esc(d.panel_error)}</div>`;
  } else {
    const rows=Array.isArray(e.data)?e.data:[]; const w=windowsOf(name, rows);
    body=rows.length?rings(w.wins):`<div class="msg">${esc(JSON.stringify(e.data))}</div>`;
    foot=`<span></span><span class="mono">updated ${clockOf(e.at)}</span>`;
  }
  const busy=e&&e.loading;
  const sub=SUB[name];
  return `<div class="tile"><div class="th"><div class="n"><span class="dot ${dot}"></span><span class="name big">${name}</span><span class="sub">${sub}</span></div>
    <button onclick="refresh('${name}')" ${busy?'disabled':''}>${busy?'Refreshing…':'Refresh'}</button></div>${body}${foot?`<div class="foot">${foot}</div>`:''}</div>`;
}
// one ring per group (Gemini, Others): the ring is the group's tightest window, every window listed under it
// per group: the big wheel is the weekly limit, the little one on its shoulder the 5-hour limit
function rings(wins){
  const names=[]; for(const w of wins) if(!names.includes(w.group)) names.push(w.group);
  names.sort((a,b)=>(a==='Gemini'?0:1)-(b==='Gemini'?0:1));
  return `<div class="rings">${names.map(n=>{ const g=wins.filter(w=>w.group===n);
    const W=g.find(w=>/week/i.test(w.win))||g[0]; const F=g.find(w=>w!==W&&/5|hour/i.test(w.win))||g.find(w=>w!==W);
    const line=w=>`<div class="w mono">${esc(w.win)} <span style="color:${colorOf(w.left)}">${w.left==null?'?':w.left+'%'}</span> · ${esc(w.resets)}</div>`;
    return `<div class="rc"><div class="badge">${ring(W.left,'left')}${F?`<div class="mini">${ring(F.left,'',true)}</div>`:''}</div><div class="lbl">${esc(n)}</div>${line(W)}${F?line(F):''}</div>`; }).join('')}</div>`;
}
// the ring shows the tightest window; the rest are bars
function facts(wins, extra){
  if(!wins.length) return `<div class="msg">no usage read</div>`;
  const sorted=wins.slice().sort((a,b)=>((a.rank||0)-(b.rank||0))||((a.left??101)-(b.left??101))); const t=sorted[0];
  const rest=sorted.slice(1).map(w=>kv(w.name, `${w.left==null?'?':w.left+'%'} · ${esc(w.resets)}`, cls(w.left)?cls(w.left)+'fg':'')+bar(w.left)).join('');
  return `<div class="body">${ring(t.left,'left')}<div class="facts"><div class="t">${esc(t.name)}</div><div class="m mono">${t.left==null?'':(100-t.left)+'% used · '}resets ${esc(t.resets)}${extra?' · '+extra:''}</div>${rest?'<div class="hr"></div>'+rest:''}</div></div>`;
}

// ---- requests: one block per backend, running first, then its newest 10 ----
const STEPS=['queued','submitted','thinking','generating','done'];
function runCard(r){
  const el=(Date.now()-new Date(r.started).getTime())/1000;
  const idx=STEPS.indexOf(r.phase); const cur=idx<0?3:idx;
  const dots=STEPS.map((s,i)=>`<span class="sd ${i<cur?'done':i===cur?'now':''}" title="${s}"></span>`).join('');
  return `<div class="run"><div class="top"><span class="mono">${esc(r.model||'default')}</span><span class="timer big mono" data-started="${esc(r.started)}">${mmss(el)}</span><button class="stop" onclick="stop('${esc(r.id)}')">Stop</button></div>
    <div class="steps">${dots}<span class="sn">${STEPS[cur]}</span>${r.note?`<span class="l2">· ${esc(r.note)}</span>`:''}</div>
    <div class="l2">prompt ${fmtN(r.prompt_chars)} chars${r.reply_chars?` · reply ${fmtN(r.reply_chars)} so far`:''}</div></div>`;
}
function resDot(p){ return p==='finished'?'var(--ok)':p==='failed'?'var(--bad)':'var(--muted)'; }
function reqBlock(name){
  const d=state.requests; const active=((d&&d.active)||[]).filter(r=>r.backend===name); const recent=((d&&d.recent)||[]).filter(r=>r.backend===name).slice(0,10);
  const rows=recent.map(r=>`<div class="rrow"><div class="l1"><span class="mono m">${esc(r.model||'default')}</span><span class="res"><span class="dot" style="background:${resDot(r.phase)}"></span>${esc(r.phase)}</span><span class="t mono">${mmss(r.elapsed_s)}</span></div>
    <div class="l2">${fmtN(r.prompt_chars)} → ${fmtN(r.reply_chars)} chars${r.note?` · <span class="${r.phase==='failed'?'badfg':''}">${esc(r.note)}</span>`:''}</div></div>`).join('');
  return `<div class="tile rq"><div class="th"><div class="n"><span class="name big">${name}</span><span class="sub">${active.length?`${active.length} running`:'idle'}</span></div></div>
    ${active.map(runCard).join('')}${rows||'<div class="msg">no requests yet</div>'}</div>`;
}
function render(){
  document.getElementById('tiles').innerHTML=BACKENDS.map(tile).join('');
  document.getElementById('req').innerHTML=BACKENDS.map(reqBlock).join('');
}

async function refresh(name){
  state[name]=Object.assign({},state[name],{loading:true}); render();
  try{ const j=await (await fetch('usage/refresh?backend='+name,{method:'POST'})).json(); state[name]=j[name]||{error:j.error||'no data'}; }
  catch(e){ state[name]={error:String(e)}; }
  render();
}
async function refreshAll(){ const b=document.getElementById('all'); b.disabled=true; await Promise.all(BACKENDS.map(refresh)); await loadRequests(); b.disabled=false; }
async function loadRequests(){ try{ state.requests=await (await fetch('status')).json(); }catch(e){ state.requests=null; } render(); }
// The server pushes the status whenever a request changes; nothing is polled.
function listen(){
  if(!('EventSource' in window)) return;
  const es=new EventSource('status/stream');
  es.onmessage=e=>{ try{ state.requests=JSON.parse(e.data); }catch(x){ return; } state.live=true; render(); };
  es.onopen=()=>{ state.live=true; render(); };
  es.onerror=()=>{ state.live=false; render(); }; // the browser reconnects on its own
}
async function stop(id){ try{ await fetch('requests/stop?id='+encodeURIComponent(id),{method:'POST'}); }catch(e){} setTimeout(loadRequests,400); }
setInterval(()=>{ for(const t of document.querySelectorAll('.timer')) t.textContent=mmss((Date.now()-new Date(t.dataset.started).getTime())/1000); },1000);

async function init(){
  document.getElementById('base').textContent=location.origin+'/v1';
  render(); // draw at once; everything below fills in as it arrives
  // web fonts are added after the first paint so a slow font host never delays the page
  const f=document.createElement('link'); f.rel='stylesheet'; f.href='https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap'; document.head.appendChild(f);
  fetch('health').then(r=>r.json()).then(h=>{ state.health=h.backends||{}; render(); }).catch(()=>{});
  try{ const c=await (await fetch('usage/cached')).json(); for(const n of BACKENDS) if(c[n]) state[n]=c[n]; }catch(e){}
  await loadRequests();
  listen();
}
init();
</script>
</body>
</html>
